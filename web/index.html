<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: https: data:; media-src file:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Piphin Hub</title>
  <link rel="stylesheet" href="ui/kit.css">
  <link rel="stylesheet" href="ui/icons.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="titlebar">
    <div class="tb-brand"><img src="../icons/hub.png" alt=""><span>Piphin</span></div>
    <button class="tb-search" id="cmdOpen" title="Pesquisar módulos, apps e ações (Ctrl+K)">
      <i class="i i-search"></i><span>Pesquisar módulos, apps e ações</span><kbd>Ctrl</kbd><kbd>K</kbd>
    </button>
  </header>

  <div class="shell" id="shell">
    <nav class="side" id="side">
      <div class="side-group">
        <button class="nav-item" data-view="home" title="Início"><i class="i i-house"></i><span>Início</span></button>
        <button class="nav-item" data-view="store" title="Loja"><i class="i i-store"></i><span>Loja</span><b class="nav-count" id="updCount" hidden></b></button>
        <button class="nav-item" data-view="media" title="Mídia: o que os módulos criaram e baixaram"><i class="i i-images"></i><span>Mídia</span></button>
        <button class="nav-item" data-view="settings" title="Configurações"><i class="i i-settings"></i><span>Configurações</span></button>
      </div>
      <div class="side-label"><span>Módulos</span></div>
      <div class="side-group side-mods" id="modNav"></div>
      <div class="spacer"></div>
      <div id="hubUpdate"></div>
      <div class="side-foot">
        <button class="nav-item" id="collapse" title="Recolher a barra lateral"><i class="i i-panel-left-close"></i><span>Recolher</span></button>
        <span class="side-ver" id="hubVer"></span>
      </div>
    </nav>
    <main id="main"></main>
  </div>

  <aside id="drawer" class="drawer" hidden></aside>
  <div id="modal" class="modal" hidden><div class="modal-box" id="modalBox"></div></div>
  <div id="palette" class="palette" hidden>
    <div class="palette-box">
      <div class="palette-input"><i class="i i-search"></i><input id="paletteInput" type="text" placeholder="Abrir módulo, instalar app, verificar atualizações..." autocomplete="off" spellcheck="false"><kbd>Esc</kbd></div>
      <div class="palette-list" id="paletteList"></div>
      <div class="palette-foot"><span><kbd>↑</kbd><kbd>↓</kbd> navegar</span><span><kbd>Enter</kbd> abrir</span><span><kbd>Ctrl</kbd><kbd>1</kbd>…<kbd>9</kbd> ir direto para um módulo</span></div>
    </div>
  </div>
  <div id="toasts" class="toasts"></div>
  <div id="mPlayer" class="m-player" hidden><span class="mp-cover" id="mpCover"></span><div class="mp-t"><b id="mpTitle"></b><span id="mpSub"></span></div>
    <audio controls></audio><button class="btn icon sm ghost" id="mpClose" title="Fechar"><i class="i i-x"></i></button></div>

  <script src="media.js"></script>
  <script src="app.js"></script>
</body>
</html>
